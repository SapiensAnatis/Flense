name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin the image's vcpkg checkout to builtin-baseline: the image's commit can predate it, and tracking master would
      # let upstream triplet/script changes alter package ABI hashes without changing the cache key.
      - name: Set up vcpkg
        id: vcpkg
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin $baseline
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --detach $baseline
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          vcpkg integrate install
          $cacheDir = "$env:RUNNER_TEMP\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force $cacheDir | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          "image-version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      # vcpkg's package hashes include the compiler version, so key on the runner image too; otherwise a toolchain
      # update would keep hitting the old cache entry without ever saving the rebuilt packages.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.image-version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Build
        run: .\Scripts\build-app.ps1 -Configuration ${{ matrix.configuration }} -OutputDirectory C:\build

      - name: Upload Flense.Core.Tests
        uses: actions/upload-artifact@v4
        with:
          name: Flense.Core.Tests-${{ matrix.configuration }}
          path: C:\build\Flense.Core.Tests\x64\${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 1

  # The Windows runner can't build Linux images, so the Docker-built test images are made here and handed to the test
  # job as an artifact.
  test-images:
    name: Build test images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Most changes don't touch TestData, so reuse the previous images rather than rebuilding them. This also stops
      # upstream base image updates from silently changing the test inputs.
      - name: Cache test images
        id: images
        uses: actions/cache@v4
        with:
          path: |
            TestData/Images
            TestData/ErrorCases
          key: test-images-${{ hashFiles('TestData/**', '!TestData/Images/**', '!TestData/ErrorCases/**') }}

      - name: Set up Docker Buildx
        if: steps.images.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: TestData/GoProject/go.mod
          cache: false

      - name: Install ko
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ko"
          curl -sSfL https://github.com/ko-build/ko/releases/download/v0.18.0/ko_0.18.0_Linux_x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/ko" ko
          echo "$RUNNER_TEMP/ko" >> "$GITHUB_PATH"

      - name: Generate test images
        if: steps.images.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./TestData/GenerateErrorCases.ps1
          ./TestData/GenerateHandBuiltImages.ps1
          ./TestData/GenerateTestImages.ps1
          ./TestData/GenerateKoImage.ps1

      - name: Upload test images
        uses: actions/upload-artifact@v4
        with:
          name: test-images
          # Both paths share TestData as their root, so the artifact holds Images/ and ErrorCases/.
          path: |
            TestData/Images
            TestData/ErrorCases
          if-no-files-found: error
          # The layers are already compressed, and the test job downloads them within minutes.
          compression-level: 0
          retention-days: 1

  test:
    name: Test (${{ matrix.configuration }})
    needs: [build, test-images]
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Download Flense.Core.Tests
        uses: actions/download-artifact@v4
        with:
          name: Flense.Core.Tests-${{ matrix.configuration }}
          path: ${{ runner.temp }}\Flense.Core.Tests

      - name: Download test images
        uses: actions/download-artifact@v4
        with:
          name: test-images
          path: ${{ runner.temp }}\Flense.Core.Tests\TestData

      - name: Run Flense.Core.Tests
        # Backstop for the in-process per-test watchdog.
        timeout-minutes: 5
        run: |
          & "$env:RUNNER_TEMP\Flense.Core.Tests\Flense.Core.Tests.exe" --gtest_output="xml:$env:RUNNER_TEMP\test-results\Flense.Core.Tests.xml"
          if ($LASTEXITCODE -ne 0) { throw "Flense.Core.Tests failed ($LASTEXITCODE)" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: ${{ runner.temp }}\test-results
          if-no-files-found: ignore
