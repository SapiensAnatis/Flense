name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin the image's vcpkg checkout to builtin-baseline: the image's commit can predate it, and tracking master would
      # let upstream triplet/script changes alter package ABI hashes without changing the cache key.
      - name: Set up vcpkg
        id: vcpkg
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin $baseline
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --detach $baseline
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          vcpkg integrate install
          $cacheDir = "$env:RUNNER_TEMP\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force $cacheDir | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          "image-version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      # vcpkg's package hashes include the compiler version, so key on the runner image too; otherwise a toolchain
      # update would keep hitting the old cache entry without ever saving the rebuilt packages.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.image-version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # Generate test data now so we don't have to checkout in the test job
      - name: Generate test data
        run: .\TestData\GenerateErrorCases.ps1

      - name: Build
        run: .\Scripts\build-app.ps1 -Configuration ${{ matrix.configuration }} -OutputDirectory C:\build

      - name: Upload Flense.Core.Tests
        uses: actions/upload-artifact@v4
        with:
          name: Flense.Core.Tests-${{ matrix.configuration }}
          path: C:\build\Flense.Core.Tests\x64\${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test (${{ matrix.configuration }})
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Download Flense.Core.Tests
        uses: actions/download-artifact@v4
        with:
          name: Flense.Core.Tests-${{ matrix.configuration }}
          path: ${{ runner.temp }}\Flense.Core.Tests

      - name: Run Flense.Core.Tests
        # Backstop for the in-process per-test watchdog.
        timeout-minutes: 5
        run: |
          & "$env:RUNNER_TEMP\Flense.Core.Tests\Flense.Core.Tests.exe" --gtest_output="xml:$env:RUNNER_TEMP\test-results\Flense.Core.Tests.xml"
          if ($LASTEXITCODE -ne 0) { throw "Flense.Core.Tests failed ($LASTEXITCODE)" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: ${{ runner.temp }}\test-results
          if-no-files-found: ignore
