name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Flense is a WinUI 3 app written in C++/WinRT; follow the
            conventions in CLAUDE.md.

            Because you are running on Linux, you cannot build or run the app. Focus on reviewing the code
            instead.

            Focus on:
            - Correctness bugs and edge cases
            - Memory safety, lifetime and threading issues (coroutines, UI thread access, captured `this`)
            - C++/WinRT and XAML pitfalls
            - Security concerns when parsing untrusted image/archive data
            - Performance problems

            Use inline comments for specific issues and a single top-level PR comment for an overall
            summary. Be concise and skip praise or nitpicks that don't affect behaviour.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
